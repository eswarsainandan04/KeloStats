<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 01 - Graduate Thesis Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background-color: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
    }

    /* Presentation Slide Canvas (16:9 Widescreen: 1920x1080) */
    .slide-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #051442;
      overflow: hidden;
      container-type: inline-size;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    /* Left Sidebar Stripe (0% to 15.2%) */
    .left-sidebar {
      position: absolute;
      left: 0;
      top: 0;
      width: 15.2%;
      height: 100%;
      background-color: #020524;
      z-index: 10;
    }

    /* Logo at top-left */
    .logo-text {
      position: absolute;
      left: 28%;
      top: 6.5%;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(18 / 19.2 * 1cqw);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* 01 Number with underline in left sidebar */
    .sidebar-number-group {
      position: absolute;
      left: 36%;
      top: 31%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .sidebar-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(66 / 19.2 * 1cqw);
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .sidebar-number-bar {
      width: calc(34 / 19.2 * 1cqw);
      height: calc(3 / 19.2 * 1cqw);
      background-color: #ffffff;
      margin-top: calc(12 / 19.2 * 1cqw);
    }

    /* Magenta Circular Arrow Button overlapping boundary at bottom-left */
    .arrow-button {
      position: absolute;
      left: 15.2%;
      top: 85.5%;
      transform: translate(-50%, -50%);
      width: calc(64 / 19.2 * 1cqw);
      height: calc(64 / 19.2 * 1cqw);
      border-radius: 50%;
      background: linear-gradient(135deg, #d946ef 0%, #a855f7 50%, #9333ea 100%);
      box-shadow: 0 calc(6 / 19.2 * 1cqw) calc(20 / 19.2 * 1cqw) rgba(168, 85, 247, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      cursor: pointer;
    }

    .arrow-button svg {
      width: calc(26 / 19.2 * 1cqw);
      height: calc(26 / 19.2 * 1cqw);
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: calc(2 / 19.2 * 1cqw);
    }

    /* Main Area Background & Luminous Spheres */
    .main-background {
      position: absolute;
      left: 15.2%;
      top: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 35% 50%, #0d388f 0%, #0a2b72 45%, #051442 100%);
      overflow: hidden;
      z-index: 1;
    }

    /* Cyan-Blue Luminous Sphere */
    .sphere-cyan {
      position: absolute;
      left: 12%;
      top: -32%;
      width: calc(1150 / 19.2 * 1cqw);
      height: calc(1150 / 19.2 * 1cqw);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, rgba(14, 165, 233, 0.42) 0%, rgba(3, 105, 220, 0.35) 42%, rgba(2, 40, 140, 0.15) 65%, transparent 75%);
      pointer-events: none;
      z-index: 2;
    }

    /* Vibrant Purple / Magenta Sphere on Right */
    .sphere-purple {
      position: absolute;
      right: -14%;
      top: 28%;
      width: calc(1180 / 19.2 * 1cqw);
      height: calc(1180 / 19.2 * 1cqw);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(192, 38, 211, 0.88) 0%, rgba(147, 51, 234, 0.75) 38%, rgba(88, 28, 135, 0.45) 60%, transparent 75%);
      pointer-events: none;
      z-index: 3;
    }

    /* SVG Halftone Dot Matrix Overlays */
    .dots-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    /* Top Right Meta Text */
    .top-meta {
      position: absolute;
      top: 6.5%;
      right: 8.5%;
      display: flex;
      align-items: center;
      gap: calc(90 / 19.2 * 1cqw);
      z-index: 15;
    }

    .meta-item {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(18 / 19.2 * 1cqw);
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    /* Center-Left Content Block */
    .content-block {
      position: absolute;
      left: 21.8%;
      top: 31%;
      max-width: 48%;
      z-index: 15;
    }

    .main-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(76 / 19.2 * 1cqw);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.14;
      letter-spacing: -0.01em;
      margin-bottom: calc(36 / 19.2 * 1cqw);
    }

    .subtitle-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(26 / 19.2 * 1cqw);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: calc(20 / 19.2 * 1cqw);
    }

    .description-text {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      font-size: calc(15.5 / 19.2 * 1cqw);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.55;
      max-width: calc(410 / 19.2 * 1cqw);
    }

    /* Bottom-Right Presentation Label */
    .presentation-label {
      position: absolute;
      right: 8.5%;
      bottom: 7.2%;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: calc(15 / 19.2 * 1cqw);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      z-index: 15;
    }
  </style>
</head>
<body>

  <!-- Slide 01 Presentation Canvas -->
  <div id="slide_01" class="slide-canvas">

    <!-- 1. Left Sidebar Dark Stripe -->
    <div class="left-sidebar">
      <!-- Logo -->
      <div id="logo_text" class="logo-text" data-editable="text">YOUR LOGO</div>

      <!-- Slide Number 01 -->
      <div class="sidebar-number-group">
        <div id="sidebar_number" class="sidebar-number" data-editable="text">01</div>
        <div class="sidebar-number-bar"></div>
      </div>
    </div>

    <!-- 2. Magenta Circular Arrow Button -->
    <div id="arrow_button" class="arrow-button" title="Next Slide">
      <svg viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>

    <!-- 3. Main Area with Luminous Gradient Background -->
    <div class="main-background">
      <!-- Luminous Gradient Spheres -->
      <div class="sphere-cyan"></div>
      <div class="sphere-purple"></div>

      <!-- SVG Dotted Halftone Matrix (Top Arc & Bottom-Right Arc) -->
      <svg class="dots-overlay" viewBox="0 0 1628 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Mask for Top Arc Dot Halftone Matrix -->
          <radialGradient id="topDotFade" cx="380" cy="0" r="620" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
            <stop offset="55%" stop-color="#fff" stop-opacity="0.8"/>
            <stop offset="85%" stop-color="#fff" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>

          <!-- Mask for Bottom-Right Arc Dot Halftone Matrix -->
          <radialGradient id="bottomDotFade" cx="1460" cy="980" r="540" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
            <stop offset="50%" stop-color="#fff" stop-opacity="0.85"/>
            <stop offset="80%" stop-color="#fff" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- TOP CONCENTRIC DOT ARCS (Hot Pink / Magenta #f43f8e) -->
        <g mask="url(#topDotFade)" fill="none" stroke="#f43f8e" stroke-linecap="round">
          <circle cx="380" cy="0" r="140" stroke-width="4.2" stroke-dasharray="0 22" opacity="0.95"/>
          <circle cx="380" cy="0" r="170" stroke-width="4.6" stroke-dasharray="0 24" opacity="0.92"/>
          <circle cx="380" cy="0" r="200" stroke-width="5.0" stroke-dasharray="0 26" opacity="0.90"/>
          <circle cx="380" cy="0" r="230" stroke-width="5.4" stroke-dasharray="0 28" opacity="0.88"/>
          <circle cx="380" cy="0" r="262" stroke-width="5.8" stroke-dasharray="0 30" opacity="0.85"/>
          <circle cx="380" cy="0" r="294" stroke-width="6.2" stroke-dasharray="0 32" opacity="0.82"/>
          <circle cx="380" cy="0" r="328" stroke-width="6.6" stroke-dasharray="0 34" opacity="0.78"/>
          <circle cx="380" cy="0" r="362" stroke-width="7.0" stroke-dasharray="0 36" opacity="0.74"/>
          <circle cx="380" cy="0" r="398" stroke-width="7.4" stroke-dasharray="0 38" opacity="0.70"/>
          <circle cx="380" cy="0" r="434" stroke-width="7.8" stroke-dasharray="0 40" opacity="0.65"/>
          <circle cx="380" cy="0" r="472" stroke-width="8.2" stroke-dasharray="0 42" opacity="0.58"/>
          <circle cx="380" cy="0" r="510" stroke-width="8.6" stroke-dasharray="0 44" opacity="0.50"/>
          <circle cx="380" cy="0" r="550" stroke-width="9.0" stroke-dasharray="0 46" opacity="0.40"/>
          <circle cx="380" cy="0" r="590" stroke-width="9.4" stroke-dasharray="0 48" opacity="0.30"/>
        </g>

        <!-- BOTTOM-RIGHT CONCENTRIC DOT ARCS (Hot Pink / Magenta #f43f8e) -->
        <g mask="url(#bottomDotFade)" fill="none" stroke="#f43f8e" stroke-linecap="round">
          <circle cx="1460" cy="980" r="160" stroke-width="4.0" stroke-dasharray="0 20" opacity="0.95"/>
          <circle cx="1460" cy="980" r="190" stroke-width="4.4" stroke-dasharray="0 22" opacity="0.92"/>
          <circle cx="1460" cy="980" r="220" stroke-width="4.8" stroke-dasharray="0 24" opacity="0.89"/>
          <circle cx="1460" cy="980" r="252" stroke-width="5.2" stroke-dasharray="0 26" opacity="0.86"/>
          <circle cx="1460" cy="980" r="284" stroke-width="5.6" stroke-dasharray="0 28" opacity="0.82"/>
          <circle cx="1460" cy="980" r="318" stroke-width="6.0" stroke-dasharray="0 30" opacity="0.78"/>
          <circle cx="1460" cy="980" r="352" stroke-width="6.4" stroke-dasharray="0 32" opacity="0.74"/>
          <circle cx="1460" cy="980" r="388" stroke-width="6.8" stroke-dasharray="0 34" opacity="0.68"/>
          <circle cx="1460" cy="980" r="424" stroke-width="7.2" stroke-dasharray="0 36" opacity="0.60"/>
          <circle cx="1460" cy="980" r="462" stroke-width="7.6" stroke-dasharray="0 38" opacity="0.50"/>
          <circle cx="1460" cy="980" r="500" stroke-width="8.0" stroke-dasharray="0 40" opacity="0.38"/>
        </g>
      </svg>
    </div>

    <!-- 4. Top Right Metadata -->
    <div class="top-meta">
      <div id="meta_education" class="meta-item" data-editable="text">Education</div>
      <div id="meta_university" class="meta-item" data-editable="text">University</div>
    </div>

    <!-- 5. Main Title & Content -->
    <div class="content-block">
      <h1 id="main_title" class="main-title" data-editable="text">Graduate Thesis<br>Defense</h1>
      <h2 id="subtitle" class="subtitle-text" data-editable="text">Graduate Thesis Defense PPT Template</h2>
      <p id="description" class="description-text" data-editable="text">
        Presentations are communication tools that can be used as speeches, reports, and more.
      </p>
    </div>

    <!-- 6. Bottom Right Presentation Label -->
    <div id="presentation_label" class="presentation-label" data-editable="text">PRESENTATION</div>

  </div>

</body>
</html>
